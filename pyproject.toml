[project]
name = "artgen"
version = "0.2.0"
description = "Image pipeline for character sheets and composition references (ComfyUI and Blender on Modal)"
readme = "README.md"
requires-python = "==3.13.*"  # bpy 5.2 LTS ships for Python 3.13 only
dependencies = [
  "bpy>=5.2.4,<5.3",
  "modal>=1.0",
  "pillow>=13.0.0",
]

[project.scripts]
artgen = "artgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
